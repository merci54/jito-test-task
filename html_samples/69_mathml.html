<!--
  ТЕСТ: MathML: элементы, самозакрывающийся mi, атрибут definitionurl.
  БРАУЗЕР: Элементы в пространстве имен MathML, слеш перед > закрывает элемент (второй mi пустой),
    атрибут definitionurl становится definitionURL.
-->
<!DOCTYPE html>
<math display="block" definitionurl="x">
  <mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac>
  <mi/>
</math>
