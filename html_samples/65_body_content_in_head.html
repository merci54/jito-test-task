<!--
  ТЕСТ: div внутри head, а после него title.
  БРАУЗЕР: div закрывает head и неявно открывает body, title после него уже в body. Явные
    закрывающий head и открывающий body потом игнорируются. head -> [meta], body -> [div, title, p].
-->
<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<div>div in head</div>
<title>title after div</title>
</head>
<body><p>body</p></body></html>
