<!--
  ТЕСТ: Форматирующие теги (b, em), которые пересекают границы блоков p.
  БРАУЗЕР: 1) b закрывается внутри p: b 'bold', потом p -> [b 'para', 'after']. 2) em не закрыт: p
    -> em 'emph', и во втором p em восстанавливается: p -> em 'still emph?'. После второго p em
    восстанавливается еще раз, уже для перевода строки в конце.
-->
<!DOCTYPE html>
<b>bold<p>para</b>after</p>
<p><em>emph</p><p>still emph?</p>
