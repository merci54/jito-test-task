<!--
  ТЕСТ: Таблица без tbody и без закрывающих tr, td, th.
  БРАУЗЕР: tbody вставляется автоматически, td/th закрывают друг друга, новый tr закрывает
    предыдущий: table -> tbody -> [tr -> [td 'a', td 'b'], tr -> [th 'c', td 'd']]. Пробельные узлы
    внутри table сохраняются.
-->
<!DOCTYPE html>
<table>
  <tr><td>a<td>b
  <tr><th>c<td>d
</table>
