<!--
  ТЕСТ: Заголовок внутри заголовка и закрытие заголовка другим уровнем.
  БРАУЗЕР: Заголовок не может быть внутри заголовка: h2 закрывает h1, получаются соседи h1 'Title' и
    h2 'Sub', лишний закрывающий h1 игнорируется. Закрывающий h4 закрывает открытый h3 (любой
    закрывающий h1-h6 закрывает любой открытый заголовок).
-->
<h1>Title<h2>Sub</h2></h1>
<h3>Three</h4>
