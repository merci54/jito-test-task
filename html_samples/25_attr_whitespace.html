<!--
  ТЕСТ: Пробелы, табы и переводы строк вокруг = и между атрибутами, атрибуты без пробела между ними.
  БРАУЗЕР: Пробельные символы вокруг = и между атрибутами допустимы: id='spaced', class='tabs',
    title='newline before value'. a="1"b="2" без пробела это ошибка парсинга, но читаются все три
    атрибута a, b, c.
-->
<div
  id = "spaced"
	class	=	'tabs'
  title=
    "newline before value"
>x</div>
<span a="1"b="2"c='3'>no space between</span>
