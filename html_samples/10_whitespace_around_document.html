<!--
  ТЕСТ: Пробелы, табы и переводы строк до doctype, вокруг html/head/body и после закрывающих тегов.
  БРАУЗЕР: Пробелы до doctype и до html игнорируются. Пробелы внутри head становятся текстом head,
    между закрывающим head и body становятся текстом html. Всё после закрывающих body и html (тут
    только пробелы) добавляется в конец body.
-->
   
	
<!DOCTYPE html>  
  <html>  
  <head>  
  </head>  
  <body>  
  <p>x</p>  
  </body>  
  </html>
