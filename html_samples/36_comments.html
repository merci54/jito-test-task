<!--
  ТЕСТ: Обычные комментарии: внутри текста, пустой, многострочный, с тегами и сущностями внутри, с
    двойным дефисом внутри.
  БРАУЗЕР: Comment-узлы создаются там, где стоят, в том числе внутри элементов. Содержимое
    комментария это сырой текст: теги и сущности внутри не разбираются ('&amp;' остается как есть).
    Пустой комментарий дает Comment с ''. Двойной дефис внутри допустим.
-->
<div>before<!-- simple -->after</div>
<!---->
<!--
multi
line
-->
<p><!-- <div>not a tag</div> &amp; not an entity --></p>
