<!--
  ТЕСТ: li без закрывающих тегов, включая вложенный список.
  БРАУЗЕР: Новый li закрывает предыдущий li своего уровня, вложенный ul не путается с внешним:
    внешний ul содержит 3 li, второй li содержит вложенный ul с 2 li. ol содержит 2 li.
-->
<ul>
  <li>one
  <li>two
    <ul><li>nested a<li>nested b</ul>
  <li>three
</ul>
<ol><li>1<li>2</ol>
