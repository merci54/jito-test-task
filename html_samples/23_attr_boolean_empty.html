<!--
  ТЕСТ: Атрибуты без значения (checked, disabled, hidden) и с пустым значением.
  БРАУЗЕР: Атрибут без значения имеет значение '' (пустая строка), так же как value=''.
    selected=selected это обычная строка 'selected'.
-->
<input type="checkbox" checked disabled>
<input value="">
<div hidden data-empty="" data-flag>x</div>
<option selected=selected>o</option>
