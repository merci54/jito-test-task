<!--
  ТЕСТ: Самозакрывающая запись у обычных элементов: div/, span/, p/.
  БРАУЗЕР: У обычных HTML-элементов слеш перед > ничего не значит, тег остается открытым и следующий
    контент уходит внутрь: div -> ['inside div', span -> ['inside span', p -> 'inside p']].
-->
<div class="a"/>inside div
<span/>inside span
<p/>inside p
