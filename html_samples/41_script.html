<!--
  ТЕСТ: script с <, >, &&, закрывающим div в строке, тегами и сущностями внутри.
  БРАУЗЕР: Содержимое script это один сырой текстовый узел: теги не разбираются, сущности не
    декодируются, закрывающий div в строке не закрывает script. Закрывает только закрывающий тег
    script. Дальше обычный p.
-->
<script>
  if (a < b && c > d) { console.log("</div>"); }
  var s = '<p>not a tag</p>';
  var e = "&amp; stays as is";
</script>
<p>after script</p>
