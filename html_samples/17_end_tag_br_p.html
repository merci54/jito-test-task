<!--
  ТЕСТ: Закрывающие теги void-элементов и p без открытого p: /br, /p, /img.
  БРАУЗЕР: Закрывающий br превращается в обычный br. Закрывающий p без открытого p создает пустой p.
    Закрывающий img просто игнорируется. Итог: div -> ['a', br, 'b', p (пустой), 'cd'].
-->
<div>a</br>b</p>c</img>d</div>
