<!--
  ТЕСТ: Значения атрибутов в двойных, одинарных кавычках и без кавычек, символы > и кавычки внутри
    значений, перевод строки в значении.
  БРАУЗЕР: Все три вида записи дают обычную строку. > и кавычки другого типа внутри кавычек это
    часть значения: e='has > inside', f='it "quoted"', g="it's". В значении без кавычек слеш тоже
    часть значения: h='a/b'. Перевод строки в i сохраняется.
-->
<div a="double" b='single' c=unquoted d="with spaces" e="has > inside" f='it "quoted"' g="it's" h=a/b i="line1
line2">text</div>
