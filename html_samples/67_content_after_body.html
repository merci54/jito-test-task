<!--
  ТЕСТ: Комментарий и элемент после закрывающих body и html.
  БРАУЗЕР: Комментарий сразу после закрывающего html становится ребенком Document (после html).
    Элемент p после него переносится обратно в body и становится его последним ребенком.
-->
<!DOCTYPE html>
<html><body><p>inside</p></body></html>
<!-- after html -->
<p>after html</p>
