<!--
  ТЕСТ: Сломанные атрибуты: пробел после =, имя начинается с = или кавычки, атрибуты слиты, слеш
    между атрибутами.
  БРАУЗЕР: 1) a='b="x"' (после = пробелы пропускаются, дальше значение без кавычек). 2) атрибут с
    именем '="eq-first"' и пустым значением. 3) атрибут '"quoted-name"' = '1'. 4) a='1', b='', c=''.
    5) a='1', b='2' (слеш просто пропускается).
-->
<div a= b="x">1</div>
<div ="eq-first">2</div>
<div "quoted-name"=1>3</div>
<div a='1'b c>4</div>
<div a="1"/b="2">5</div>
