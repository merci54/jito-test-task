<!--
  ТЕСТ: Комментарии, закрытые сразу после открытия (открытие плюс >, открытие плюс дефис плюс >), и
    закрытие через два дефиса, ! и >.
  БРАУЗЕР: Первые два варианта дают пустой Comment (ошибка парсинга), а 'b' и 'd' это обычный текст
    в p. Последовательность из двух дефисов, ! и > тоже закрывает комментарий: Comment ' closed by
    bang ', потом текст 'f'.
-->
<p>a<!-->b</p>
<p>c<!--->d</p>
<p>e<!-- closed by bang --!>f</p>
