<!--
  ТЕСТ: Открывающий HTML-комментарий в начале script, а внутри строки еще один script с закрывающим
    тегом.
  БРАУЗЕР: После открывающего комментария внутренний открывающий script включает режим
    double-escaped, и закрывающий тег в строке НЕ закрывает внешний script. Весь текст до последнего
    закрывающего script это содержимое script, дальше обычный p.
-->
<script><!--
document.write("<script>inner</script>");
--></script>
<p>after</p>
